name: Generate Daily Moments

on:
  schedule:
    # Runs at 12:00 AM IST (18:30 UTC) every day
    - cron: '30 18 * * *'
  # Allows you to manually trigger the workflow from the Actions tab
  workflow_dispatch:

jobs:
  generate-moments:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Daily Moment Generation Script
        env:
          # Pass required secrets to the environment so the script can authenticate
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          # JSON string containing an array of targets: [["userId", "profileId", "apiKey?"]]
          TARGETS_JSON: ${{ secrets.DAILY_MOMENT_TARGETS }}
        run: npx tsx src/scripts/generate_daily_moment.ts
